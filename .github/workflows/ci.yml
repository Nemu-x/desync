name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GO_VERSION: '1.26.10'
  GOTOOLCHAIN: local
  GOWORK: 'off'
  GOFLAGS: -buildvcs=false

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::These files need gofmt:"
            echo "$unformatted"
            exit 1
          fi
      - name: go mod tidy
        run: go mod tidy -diff
      - name: go vet (linux, windows, darwin)
        run: |
          for os in linux windows darwin; do
            echo "::group::GOOS=$os"
            GOOS=$os go vet ./...
            echo "::endgroup::"
          done

  test:
    name: Test · ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-24.04 }
          - { name: Windows, os: windows-2025 }
          - { name: macOS, os: macos-latest }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test
        shell: bash
        run: go test -count=1 -timeout=3m -shuffle=on -coverprofile=coverage.out ./...
      - name: Native capability report
        shell: bash
        run: go test -count=1 -timeout=2m -run 'Capabilities|ProbeConn|SplitAck|TCPInfo|Getsockopt|SocketMethod|OOB|Disorder|LinuxFake|LowHop|UDPFake' -v .
      # The drop filter that makes the server discard low-hop segments needs
      # root on the runners; without root the test skips itself.
      - name: Low-hop drop test (root)
        if: runner.os == 'Linux'
        shell: bash
        run: sudo env "PATH=$PATH" GOTOOLCHAIN="$GOTOOLCHAIN" GOWORK="$GOWORK" GOFLAGS="$GOFLAGS" DESYNC_REQUIRE_LOWHOP=1 go test -count=1 -timeout=2m -run '^TestLinuxLowHopDropRetransmitsOriginal$' -v .
      - name: Coverage summary
        if: always() && hashFiles('coverage.out') != ''
        shell: bash
        run: |
          total="$(go tool cover -func=coverage.out | awk '/^total:/ {print $3}')"
          {
            echo "### Coverage · ${{ matrix.name }}"
            echo
            echo "Total statement coverage: **${total}**"
          } >> "$GITHUB_STEP_SUMMARY"

  race:
    name: Race · Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Test with the race detector
        run: go test -race -count=1 -timeout=5m ./...

  fuzz:
    name: Fuzz · ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: FuzzClientHelloFraming, pkg: . }
          - { target: FuzzClientHelloAssembly, pkg: . }
          - { target: FuzzControllerTarget, pkg: ./controller }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Fuzz for 30s
        run: go test ${{ matrix.pkg }} -run '^$' -fuzz '^${{ matrix.target }}$' -fuzztime=30s -fuzzminimizetime=5s -parallel=2
      - name: Upload the failing input
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-${{ matrix.target }}
          path: '**/testdata/fuzz/${{ matrix.target }}/*'
          if-no-files-found: ignore

  minimum-go:
    name: Go 1.20 compatibility · Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go 1.20
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.20.14'
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -timeout=3m ./...

  minimum-go-windows:
    name: Go 1.20 compatibility · Windows
    runs-on: windows-2025
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go 1.20
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.20.14'
          cache: false
      - name: Vet
        shell: bash
        run: go vet ./...
      - name: Test (native fake TCP/UDP and split wait)
        shell: bash
        run: go test -count=1 -timeout=3m ./...

  build:
    name: Build · ${{ matrix.goos }}/${{ matrix.goarch }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        goos: [windows, linux, darwin]
        goarch: [amd64, arm64]
        include:
          - { goos: linux, goarch: arm, goarm: '7' }
          - { goos: android, goarch: arm64 }
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: false
      - name: Build the library, desync-socks and desync-probe
        env:
          CGO_ENABLED: '0'
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
        run: |
          go build ./...
          go build -trimpath -ldflags='-s -w' -o "desync-socks${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/desync-socks
          go build -trimpath -ldflags='-s -w' -o "desync-probe${{ matrix.goos == 'windows' && '.exe' || '' }}" ./cmd/desync-probe

  ci:
    name: CI
    if: always()
    needs: [lint, test, race, fuzz, minimum-go, minimum-go-windows, build]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: All checks passed
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "Results: $RESULTS"
          for r in $RESULTS; do
            if [ "$r" != "success" ]; then
              echo "::error::A required job finished with: $r"
              exit 1
            fi
          done
